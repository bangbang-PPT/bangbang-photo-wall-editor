<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片墙工作室 · 展示视频</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #0d0f14; color: #f5f7fb; }
    main { width: min(1180px, 100%); }
    h1 { margin: 0 0 8px; font-size: clamp(22px, 3vw, 34px); }
    p { margin: 0 0 20px; color: #aeb7c8; }
    video { display: block; width: 100%; max-height: 78vh; border: 1px solid #2c3442; border-radius: 16px; background: #07090d; box-shadow: 0 24px 80px rgb(0 0 0 / 35%); }
    a { color: #8bb5ff; }
  </style>
</head>
<body>
  <main>
    <h1>图片墙工作室</h1>
    <p>从布局选择、画布预览到参数调整和动画时间轴的完整流程。</p>
    <video controls autoplay muted loop playsinline preload="auto" poster="./photo-wall-editor-poster.jpg">
      <source src="./photo-wall-editor.webm" type="video/webm">
      当前浏览器不支持 WebM 播放，请使用最新版 Chrome、Edge 或 Firefox。
    </video>
    <p style="margin-top:16px"><a href="/">返回图片墙编辑器</a></p>
  </main>
</body>
</html>
